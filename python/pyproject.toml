[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zig-fd-logging"
version = "0.1.0"
description = "A standard logging handler for the Zig fd-log-run collector"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["zig_fd_logging"]
